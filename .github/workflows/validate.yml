name: Validate

on:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate v0.12.0 metadata compatibility fixture
        run: |
          python3 tools/package_release.py \
            --upstream-tag v0.12.0 \
            --upstream-commit ffed38adbc33509480b5340e5173638bc20a68ff \
            --compatibility-tag v0.12.0 \
            --release-tag v0.12.0 \
            --native-commit "${{ github.sha }}" \
            --official-upstream-assets
          python3 tools/validate_artifacts.py
          python3 tools/validate_runtime_dependencies.py
      - name: Validate Python tooling
        run: |
          python3 -m py_compile \
            tools/download_utils.py \
            tools/test_download_utils.py \
            tools/test_release_readback.py \
            tools/runtime_dependency_utils.py \
            tools/macos_runtime_identity.py \
            tools/git_lfs_utils.py \
            tools/litert_lm_symbols.py \
            tools/fetch_litert_lm_asr_smoke_assets.py \
            tools/litert_lm_asr_smoke.py \
            tools/prebuilt_overrides.py \
            tools/windows_dxc.py \
            tools/fetch_upstream.py \
            tools/check_upstream_release.py \
            tools/release_version_policy.py \
            tools/release_result.py \
            tools/publication_state.py \
            tools/validate_release_result.py \
            tools/generate_schema2_contract_fixture.py \
            tools/build_upstream_runtime.py \
            tools/package_release.py \
            tools/validate_artifacts.py \
            tools/package_upstream_prebuilts.py \
            tools/package_official_release_assets.py \
            tools/package_ios_runtime.py \
            tools/package_macos_runtime.py \
            tools/package_apple_xcframeworks.py \
            tools/validate_runtime_artifacts.py \
            tools/validate_runtime_dependencies.py \
            tools/validate_release_manifest.py \
            tools/test_package_ios_runtime.py \
            tools/test_package_macos_runtime.py \
            tools/test_package_upstream_prebuilts.py \
            tools/test_build_upstream_runtime.py \
            tools/test_litert_lm_bridge.py \
            tools/test_litert_lm_asr_smoke.py \
            tools/test_fetch_litert_lm_asr_smoke_assets.py \
            tools/test_litert_lm_symbols.py \
            tools/test_prebuilt_overrides.py \
            tools/test_windows_dxc.py \
            tools/test_check_upstream_release.py \
            tools/test_release_version_policy.py \
            tools/test_release_result.py \
            tools/test_publication_state.py \
            tools/test_validate_release_manifest.py \
            tools/test_package_release.py \
            tools/test_runtime_dependency_utils.py \
            tools/test_git_lfs_utils.py
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/generate_schema2_contract_fixture.py \
            --output /tmp/schema2_contract_manifest.json
          cmp tools/fixtures/schema2_contract_manifest.json \
            /tmp/schema2_contract_manifest.json
      - name: Validate download diagnostic contracts
        run: python3 -m unittest discover -s diagnostics -p 'test_*.py'
      - name: Web scaffold self-test
        run: node web/src/index.js --self-test

  publication-lifecycle:
    name: Publication lifecycle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exercise production publication steps with a stateful GitHub fixture
        run: python3 tests/test_release_tag_lifecycle.py

  linux-loader-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install real ELF loader tools
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: Test Linux-only runtime identity and dlopen
        run: python3 -m unittest discover -s tools -p test_linux_runtime_metadata.py
