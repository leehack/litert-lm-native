name: Detect Upstream Release

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Detect and prepare exact release inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve latest stable upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/fetch_upstream.py --latest --metadata-only > upstream.json

      - name: Evaluate consumability without dispatching
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/check_upstream_release.py \
            --candidate upstream.json \
            --native-repository "${{ github.repository }}" \
            > preparation.json
          cat preparation.json
          should_prepare="$(python3 -c 'import json; print(str(json.load(open("preparation.json"))["shouldPrepare"]).lower())')"
          echo "should_prepare=$should_prepare" >> "$GITHUB_OUTPUT"

      - name: Upload preparation record
        uses: actions/upload-artifact@v4
        with:
          name: upstream-release-preparation-${{ github.run_id }}
          path: |
            upstream.json
            preparation.json
          retention-days: 30

      - name: Summarize preparation-only result
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          result = json.load(open("preparation.json", encoding="utf-8"))
          print("## LiteRT-LM upstream detection")
          print()
          print(result["message"])
          print()
          print(f"Reason: `{result['reason']}`")
          print(f"Preparation available: `{str(result['shouldPrepare']).lower()}`")
          print()
          print("This scheduled workflow never dispatches a build and never publishes.")
          if result["shouldPrepare"]:
              preparation = result["preparation"]
              print("A maintainer or central llamadart orchestration may use the exact inputs:")
              for key, value in preparation.items():
                  print(f"- `{key}`: `{value}`")
          PY
