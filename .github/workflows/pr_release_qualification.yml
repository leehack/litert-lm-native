name: PR Release Qualification

on:
  pull_request:

concurrency:
  group: pr-release-qualification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QUALIFICATION_RELEASE_TAG: v0.17.0
  QUALIFICATION_UPSTREAM_TAG: v0.17.0
  QUALIFICATION_UPSTREAM_COMMIT: e9fd8c53ff968071774206163027dd84bedfe925

jobs:
  preflight:
    name: Shared tooling validation
    uses: ./.github/workflows/validate.yml

  scope:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.select.outputs.native }}
      full: ${{ steps.select.outputs.full }}
      matrix: ${{ steps.select.outputs.matrix }}
      qwen: ${{ steps.select.outputs.qwen }}
      qwen_matrix: ${{ steps.select.outputs.qwen_matrix }}
      platforms: ${{ steps.select.outputs.platforms }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/qualification_scope.py

  tokenizer-compatibility:
    needs: [preflight, scope]
    if: needs.scope.outputs.native == 'true'
    name: SentencePiece BPE compatibility and sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Qualify untouched Qwen tokenizer and malformed-model guards
        env:
          CC: clang
          CXX: clang++
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1
        run: python3 tools/qualify_sentencepiece_bpe_null.py --work-dir tokenizer-qualification --sanitize

  build:
    needs: [preflight, scope, tokenizer-compatibility]
    if: needs.scope.outputs.native == 'true'
    name: Build and smoke (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify exact pull-request head
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"

      - name: Verify pinned upstream tag identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/verify_qualification_source.py --tag "$QUALIFICATION_UPSTREAM_TAG" --commit "$QUALIFICATION_UPSTREAM_COMMIT"

      - name: Install Linux ELF packaging tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Set up Node.js for Bazelisk fallback
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Android NDK
        id: setup-ndk
        if: matrix.platform == 'android'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28b
          add-to-path: false

      - name: Cache Bazel
        if: matrix.platform != 'windows' && !(matrix.platform == 'macos' && matrix.arch == 'x64') && !(matrix.platform == 'linux' && matrix.arch == 'x64') && !(matrix.platform == 'android' && matrix.arch == 'x64')
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
            ~/Library/Caches/bazelisk
            .bazel-output-root
          key: pr-bazel-${{ runner.os }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ env.QUALIFICATION_UPSTREAM_COMMIT }}-${{ hashFiles('tools/build_upstream_runtime.py') }}

      - name: Build exact upstream LiteRT-LM runtime
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          BAZEL_OUTPUT_USER_ROOT: ${{ matrix.bazel_output_root }}
        run: |
          python3 tools/build_upstream_runtime.py \
            --upstream-tag "$QUALIFICATION_UPSTREAM_TAG" \
            --upstream-ref "$QUALIFICATION_UPSTREAM_COMMIT" \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --jobs "${{ matrix.jobs }}"

      - name: Fetch pinned ASR smoke assets
        if: >-
          (matrix.platform == 'linux' && matrix.arch == 'x64') ||
          (matrix.platform == 'windows' && matrix.arch == 'x64') ||
          (matrix.platform == 'macos' && matrix.arch == 'arm64' && runner.arch == 'ARM64')
        run: python3 tools/fetch_litert_lm_asr_smoke_assets.py --output-dir asr-smoke-assets

      - name: Run Unix ASR real-model smoke
        if: >-
          (matrix.platform == 'linux' && matrix.arch == 'x64') ||
          (matrix.platform == 'macos' && matrix.arch == 'arm64' && runner.arch == 'ARM64')
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ matrix.platform }}" = linux ]; then
            export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/bin/linux/x64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            library="bin/linux/x64/libLiteRtLm.so"
          else
            export DYLD_LIBRARY_PATH="$GITHUB_WORKSPACE/bin/macos/arm64${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
            library="bin/macos/arm64/libLiteRtLm.dylib"
          fi
          python3 tools/litert_lm_asr_smoke.py \
            --library "$library" \
            --model asr-smoke-assets/moonshine_tiny_5s_i8.tflite \
            --tokenizer asr-smoke-assets/moonshine_tokenizer.json \
            --audio asr-smoke-assets/jfk.wav \
            --expect country \
            --evidence-json "release-evidence/${{ matrix.platform }}-${{ matrix.arch }}.json" \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --upstream-commit "$QUALIFICATION_UPSTREAM_COMMIT" \
            --native-commit "$PR_HEAD_SHA" \
            --release-tag "$QUALIFICATION_RELEASE_TAG"

      - name: Run Windows ASR real-model smoke
        if: matrix.platform == 'windows' && matrix.arch == 'x64'
        shell: pwsh
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $env:PATH = "$pwd\bin\windows\x64;$env:PATH"
          python tools/litert_lm_asr_smoke.py `
            --library bin/windows/x64/LiteRtLm.dll `
            --model asr-smoke-assets/moonshine_tiny_5s_i8.tflite `
            --tokenizer asr-smoke-assets/moonshine_tokenizer.json `
            --audio asr-smoke-assets/jfk.wav `
            --expect country `
            --evidence-json release-evidence/windows-x64.json `
            --platform windows `
            --arch x64 `
            --upstream-commit "$env:QUALIFICATION_UPSTREAM_COMMIT" `
            --native-commit "$env:PR_HEAD_SHA" `
            --release-tag "$env:QUALIFICATION_RELEASE_TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: pr-runtime-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            bin
            release-evidence
          if-no-files-found: error
          retention-days: 14

  verify:
    name: ${{ needs.scope.outputs.full == 'true' && 'Verify nine-platform candidate' || 'Verify affected-platform candidate' }}
    needs: [preflight, scope, tokenizer-compatibility, build]
    if: always() && needs.scope.outputs.native == 'true'
    runs-on: macos-latest
    steps:
      - name: Require successful qualification prerequisites
        shell: bash
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          TOKENIZER_RESULT: ${{ needs.tokenizer-compatibility.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$PREFLIGHT_RESULT" = success
          test "$TOKENIZER_RESULT" = success
          test "$BUILD_RESULT" = success
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Package exact upstream prebuilts
        run: |
          python3 tools/package_upstream_prebuilts.py \
            --upstream-tag "$QUALIFICATION_UPSTREAM_TAG" \
            --upstream-ref "$QUALIFICATION_UPSTREAM_COMMIT" \
            --clean \
            --skip-overrides

      - uses: actions/download-artifact@v4
        with:
          pattern: pr-runtime-*
          path: staged
          merge-multiple: true

      - name: Merge source-built runtimes
        run: cp -R staged/bin/* bin/

      - name: Apply pinned prebuilt overrides
        run: |
          python3 tools/package_upstream_prebuilts.py \
            --upstream-tag "$QUALIFICATION_UPSTREAM_TAG" \
            --overrides-only

      # Partial candidates must not qualify untouched upstream Apple prebuilts.
      - name: Exclude unselected iOS prebuilts
        if: needs.scope.outputs.full != 'true' && !contains(fromJSON(needs.scope.outputs.platforms), 'ios')
        run: rm -rf bin/ios
      - name: Exclude unselected macOS prebuilts
        if: needs.scope.outputs.full != 'true' && !contains(fromJSON(needs.scope.outputs.platforms), 'macos')
        run: rm -rf bin/macos

      - name: Package source-built iOS runtimes
        if: contains(fromJSON(needs.scope.outputs.platforms), 'ios')
        run: |
          python3 tools/package_ios_runtime.py \
            --upstream-tag "$QUALIFICATION_UPSTREAM_TAG" \
            --clean
      - name: Package source-built macOS runtimes
        if: contains(fromJSON(needs.scope.outputs.platforms), 'macos')
        run: |
          python3 tools/package_macos_runtime.py \
            --upstream-tag "$QUALIFICATION_UPSTREAM_TAG" \
            --clean

      - name: Qualify Apple SwiftPM archives
        run: |
          python3 tools/package_apple_xcframeworks.py \
            --release-tag "$QUALIFICATION_RELEASE_TAG" \
            --clean

      - name: Verify pinned upstream tag identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/verify_qualification_source.py --tag "$QUALIFICATION_UPSTREAM_TAG" --commit "$QUALIFICATION_UPSTREAM_COMMIT"

      - name: Validate runtime matrix and real-model evidence
        if: needs.scope.outputs.full == 'true'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 tools/validate_runtime_artifacts.py \
            --upstream-tag "$QUALIFICATION_UPSTREAM_TAG" \
            --allow-missing-official-assets
          python3 tools/validate_runtime_dependencies.py
          PYTHONPATH=tools python3 - <<'PY'
          import os
          from pathlib import Path
          from package_release import load_smoke_evidence

          evidence = load_smoke_evidence(
              Path("staged/release-evidence"),
              upstream_commit=os.environ["QUALIFICATION_UPSTREAM_COMMIT"],
              native_commit=os.environ["PR_HEAD_SHA"],
              release_tag=os.environ["QUALIFICATION_RELEASE_TAG"],
          )
          actual = {(item["platform"], item["arch"]) for item in evidence}
          expected = {("linux", "x64"), ("windows", "x64"), ("macos", "arm64")}
          if actual != expected:
              raise SystemExit(
                  f"Expected exact real-model evidence {sorted(expected)}, got {sorted(actual)}"
              )
          print(f"Verified all nine runtimes and {len(evidence)} real-model smokes")
          PY

      - name: Validate affected platform runtime inventory
        if: needs.scope.outputs.full != 'true'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SELECTED_MATRIX: ${{ needs.scope.outputs.matrix }}
          SELECTED_PLATFORMS: ${{ needs.scope.outputs.platforms }}
        run: python3 tools/validate_affected_candidate.py

      - name: Upload packaged candidates for Qwen inference
        uses: actions/upload-artifact@v4
        with:
          name: packaged-qwen-candidates
          path: bin
          if-no-files-found: error

  qwen-inference:
    name: Qwen inference (${{ matrix.platform }}-${{ matrix.arch }})
    needs: [scope, verify]
    if: needs.scope.outputs.qwen == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.qwen_matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: packaged-qwen-candidates
          path: bin
      - name: Check out pinned Dart consumer for real Qwen inference
        uses: actions/checkout@v6
        with:
          repository: leehack/llamadart
          ref: 6491e6d5c8ad80be09483861f1b99f84e76e4f11
          path: consumer-smoke
          persist-credentials: false
      - name: Set up consumer SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - name: Fetch checksum-pinned Qwen model
        shell: bash
        run: |
          mkdir -p qwen-smoke-assets
          python3 -c 'import sys; sys.path.insert(0, "tools"); from pathlib import Path; from qualify_sentencepiece_bpe_null import verified_download, MODEL_URL, MODEL_SHA; verified_download(MODEL_URL, Path("qwen-smoke-assets/Qwen3-0.6B.litertlm"), MODEL_SHA)'
      - name: Run real Qwen CPU inference against candidate runtime
        shell: bash
        env:
          LLAMADART_LITERT_LM_LIB_DIR: ${{ github.workspace }}/bin/${{ matrix.platform }}/${{ matrix.arch }}
        run: |
          export LD_LIBRARY_PATH="$LLAMADART_LITERT_LM_LIB_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export DYLD_LIBRARY_PATH="$LLAMADART_LITERT_LM_LIB_DIR${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          export PATH="$LLAMADART_LITERT_LM_LIB_DIR:$PATH"
          model="$GITHUB_WORKSPACE/qwen-smoke-assets/Qwen3-0.6B.litertlm"
          cd consumer-smoke
          dart pub get
          dart --packages=.dart_tool/package_config.json ../tools/qwen_runtime_preflight.dart
          dart run tool/litert_lm_engine_smoke.dart "$model" cpu 'What is 2+2? Answer only with the number.' 16 1024

  qualification-result:
    if: always()
    needs: [scope, preflight, tokenizer-compatibility, build, verify, qwen-inference]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Require success for all selected qualification lanes
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 tools/qualification_scope.py --check-results
